<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una frase — Dra. Daphne Amaral Alemán</title>
<meta name="description" content="Escribe una frase eligiendo. Al terminar, la mandas. Ortodoncia y medicina dental del sueño en Guadalajara.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap">

<style>
/* ============================================================
   Una frase — Dra. Daphne Amaral
   La idea: no navegas, ESCRIBES. La pantalla es una sola oración
   gigante con huecos. Cada elección llena un hueco. Cuando la
   frase está completa, esa frase es el mensaje.
   Sin tarjetas, sin cuadrícula, sin contenedores. Solo texto.
   ============================================================ */
:root {
  --papel: #ffffff;
  --tinta: #141210;            /* 18.9:1 */
  --gris: #5e5852;             /* 7.0:1 */
  --rotulo: #767068;           /* 4.9:1 */
  --linea: #e9e5df;
  --firma: #6e5546;            /* 6.9:1 — el marrón del monograma */
  --accion: #1f5e52;           /* 7.6:1 AAA */
  --alarma: #9a3324;           /* 7.3:1 AAA */
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --sans: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.19, 1, .22, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--papel);
  color: var(--tinta);
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 300;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
:focus-visible { outline: 2px solid var(--accion); outline-offset: 4px; }

.pagina {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}

/* ---------- Rótulos de esquina: casi invisibles ---------- */
.esquinas {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding-block: 20px;
  font-size: 11px;
  letter-spacing: 0.17em;
  text-transform: uppercase;
  color: var(--rotulo);
  flex-wrap: wrap;
}
.esquinas a { color: var(--firma); text-decoration: none; }
.paso-contador { margin-left: auto; font-variant-numeric: tabular-nums; }

/* ============================================================
   LA FRASE — el elemento monumental
   ============================================================ */
.lienzo {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  max-width: 1240px;
  width: 100%;
  margin: 0 auto;
  padding-block: clamp(20px, 4vh, 48px);
}

.frase {
  font-family: var(--display);
  font-weight: 300;
  font-size: clamp(34px, 7.2vw, 96px);
  line-height: 1.06;
  letter-spacing: -0.028em;
  margin: 0;
  max-width: 17ch;
}

/* Parte ya escrita */
.escrito {
  color: var(--tinta);
  cursor: pointer;
  transition: opacity 300ms var(--ease);
  position: relative;
  white-space: normal;
}
.escrito:hover { opacity: .45; }
.escrito::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: .07em;
  height: 1px;
  background: var(--firma);
  opacity: 0;
  transition: opacity 260ms var(--ease);
}
.escrito:hover::after { opacity: 1; }

/* El hueco que toca llenar: una línea que late */
.hueco {
  color: var(--firma);
  border-bottom: 2px solid var(--firma);
  padding-bottom: .04em;
  animation: late 2.4s ease-in-out infinite;
}
@keyframes late { 0%, 100% { opacity: 1 } 50% { opacity: .42 } }

/* Lo que todavía no se escribe */
.pendiente { color: var(--linea); }

/* ---------- Las opciones: texto suelto, sin caja ---------- */
.opciones {
  margin-top: clamp(32px, 5vh, 62px);
  display: flex;
  flex-wrap: wrap;
  gap: clamp(14px, 2.4vw, 34px) clamp(20px, 3.4vw, 48px);
  align-items: baseline;
  max-width: 1040px;
}
.opcion {
  background: none;
  border: 0;
  padding: 0;
  font-family: var(--display);
  font-weight: 300;
  font-size: clamp(21px, 2.9vw, 38px);
  line-height: 1.1;
  letter-spacing: -0.014em;
  color: var(--gris);
  cursor: pointer;
  position: relative;
  transition: color 240ms var(--ease), transform 340ms var(--ease);
  text-align: left;
  display: inline-block;
}
.opcion::after {
  content: "";
  position: absolute;
  left: 0; bottom: -.1em;
  width: 0; height: 2px;
  background: var(--firma);
  transition: width 340ms var(--ease);
}
@media (hover: hover) {
  .opcion:hover { color: var(--tinta); transform: translateY(-3px); }
  .opcion:hover::after { width: 100%; }
}
.opcion:focus-visible { color: var(--tinta); }
.opcion:focus-visible::after { width: 100%; }

/* La marca de urgencia va pegada a la palabra, en superíndice */
.opcion .alerta {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--alarma);
  vertical-align: super;
  margin-left: 6px;
  white-space: nowrap;
}

/* ---------- Glosa: el porqué, abajo y chiquito ---------- */
.glosa {
  margin-top: clamp(28px, 4.5vh, 52px);
  padding-top: 18px;
  border-top: 1px solid var(--linea);
  font-size: 15px;
  line-height: 1.62;
  color: var(--gris);
  max-width: 56ch;
}

/* ============================================================
   EL FINAL — la frase completa, y el envío
   ============================================================ */
.final .frase { color: var(--tinta); }
.final-acciones {
  margin-top: clamp(32px, 5vh, 56px);
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
}
.enviar {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  min-height: 58px;
  padding: 0 34px;
  background: var(--accion);
  color: #fff;
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 500;
  text-decoration: none;
  border: 0;
  transition: transform 180ms var(--ease), background-color 240ms var(--ease);
}
.enviar:active { transform: scale(.98); }
@media (hover: hover) { .enviar:hover { background: #17483f; } }
.enviar--urgente { background: var(--alarma); }
@media (hover: hover) { .enviar--urgente:hover { background: #7d2a1e; } }

.reiniciar {
  font-family: var(--sans);
  font-size: 15px;
  color: var(--gris);
  background: none;
  border: 0;
  padding: 0 6px;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-color: var(--linea);
}
@media (hover: hover) { .reiniciar:hover { color: var(--tinta); } }

/* El aviso de urgencia: una línea roja, sin caja */
.urgencia {
  margin-top: 26px;
  padding-left: 15px;
  border-left: 3px solid var(--alarma);
  font-size: 15px;
  line-height: 1.6;
  color: var(--tinta);
  max-width: 52ch;
}
.urgencia strong { color: var(--alarma); font-weight: 500; }

.sobre {
  margin-top: 26px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--rotulo);
  max-width: 54ch;
}

/* ---------- Pie ---------- */
.pie {
  padding-block: 22px 32px;
  font-size: 12px;
  line-height: 1.65;
  color: var(--rotulo);
  border-top: 1px solid var(--linea);
  max-width: 1240px;
  width: 100%;
  margin: 0 auto;
}
.pie a { color: var(--firma); }

/* ---------- Movimiento ---------- */
.entra { animation: surge 520ms var(--ease) both; }
@keyframes surge {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: none; }
}
/* Las opciones entran escalonadas: se leen en orden. */
.opcion { animation: surge 460ms var(--ease) both; }
.opcion:nth-child(1) { animation-delay: 60ms }
.opcion:nth-child(2) { animation-delay: 115ms }
.opcion:nth-child(3) { animation-delay: 170ms }
.opcion:nth-child(4) { animation-delay: 225ms }

@media (prefers-reduced-motion: reduce) {
  .entra, .opcion { animation-duration: .01ms; animation-delay: 0ms; }
  .hueco { animation: none; }
  *, *::before, *::after { transition-duration: .01ms !important; }
}

.banda {
  background: var(--tinta);
  color: #fff;
  font-size: 12.5px;
  line-height: 1.5;
  padding: 10px max(24px, env(safe-area-inset-left, 0px));
}
.banda strong { font-weight: 500; }
</style>
</head>
<body>

<div class="banda">
  <strong>Demostración.</strong> El mensaje llega a un número de prueba, no al consultorio.
</div>

<div class="pagina">
  <div class="esquinas">
    <a href="index.html">Dra. Daphne Amaral Alemán</a>
    <span>Guadalajara</span>
    <span class="paso-contador" id="contador">01 / 04</span>
  </div>

  <main class="lienzo" id="app"></main>

  <footer class="pie">
    <p>Esto no sustituye una valoración y aquí no damos diagnósticos.
      <a href="index.html">Ir al sitio</a></p>
  </footer>
</div>

<script>
// ---------------------------------------------------------------
// El contenido está escrito como PARTES DE UNA FRASE.
// La frase final es literalmente lo que la persona eligió.
// ---------------------------------------------------------------
var TEMAS = [
  {
    id: 'respiras', palabra: 'cómo respiro',
    glosa: 'La boca abierta al dormir reseca las encías, cambia dónde descansa la lengua e influye en cómo crecen los maxilares.',
    ramas: [
      {
        id: 'boca', palabra: 'duermo con la boca abierta',
        glosa: 'El aire entra por donde no debería durante horas. A veces el origen es nasal, a veces la postura de la lengua.',
        hojas: [
          { id: 'seca', palabra: 'y despierto con la boca muy seca' },
          { id: 'encias', palabra: 'y mis encías se inflaman' },
          { id: 'hijo', palabra: 'igual que mi hijo' }
        ]
      },
      {
        id: 'nariz', palabra: 'no me entra aire por la nariz',
        glosa: 'Si respirar por la nariz cuesta, el cuerpo compensa con la boca. Eso tiene consecuencias dentales.',
        hojas: [
          { id: 'siempre', palabra: 'casi siempre' },
          { id: 'acostado', palabra: 'solo cuando me acuesto' },
          { id: 'lado', palabra: 'solo de un lado' }
        ]
      }
    ]
  },
  {
    id: 'duermo', palabra: 'cómo duermo',
    glosa: 'Dormir las horas y amanecer sin energía suele significar que el descanso se interrumpe sin que te enteres.',
    ramas: [
      {
        id: 'ronco', palabra: 'ronco',
        glosa: 'Roncar es aire pasando apretado. Conviene distinguir el ronquido simple del que viene con pausas.',
        hojas: [
          { id: 'fuerte', palabra: 'y se oye desde otro cuarto' },
          { id: 'pausas', palabra: 'y me dicen que dejo de respirar', urgente: true },
          { id: 'nino', palabra: 'igual que mi hijo' }
        ]
      },
      {
        id: 'cansado', palabra: 'despierto cansado',
        glosa: 'Si duermes completo y amaneces como si no, algo corta el sueño. Apretar los dientes es una de las causas.',
        hojas: [
          { id: 'mandibula', palabra: 'con la mandíbula tensa' },
          { id: 'cabeza', palabra: 'con dolor de cabeza' },
          { id: 'noche', palabra: 'porque me desvelo sin saber por qué' }
        ]
      }
    ]
  },
  {
    id: 'muerdo', palabra: 'cómo muerdo',
    glosa: 'Chasquidos, tensión al masticar o apertura limitada son formas en que la articulación pide revisión.',
    ramas: [
      {
        id: 'truena', palabra: 'me truena la mandíbula',
        glosa: 'Un tronido aislado y sin dolor casi nunca es urgente. Con dolor o con bloqueos, cambia la conversación.',
        hojas: [
          { id: 'sin-dolor', palabra: 'aunque no me duele' },
          { id: 'con-dolor', palabra: 'y además me duele' }
        ]
      },
      {
        id: 'abro', palabra: 'no abro bien la boca',
        glosa: 'La limitación de apertura y el bloqueo se atienden pronto, mejor que esperar una cita de rutina.',
        hojas: [
          { id: 'masticar', palabra: 'y me duele al masticar' },
          { id: 'completo', palabra: 'desde hace varios días', urgente: true },
          { id: 'traba', palabra: 'porque se me traba', urgente: true }
        ]
      }
    ]
  },
  {
    id: 'veo', palabra: 'cómo se ven mis dientes',
    glosa: 'Casi todo el mundo llega por aquí. En la valoración revisamos también cómo funcionan, porque de eso depende que el resultado dure.',
    ramas: [
      {
        id: 'chuecos', palabra: 'están chuecos',
        glosa: 'Los dientes se encabalgan por falta de espacio, y la falta de espacio tiene causas.',
        hojas: [
          { id: 'invisalign', palabra: 'y los quiero alinear sin brackets' },
          { id: 'brackets', palabra: 'y quiero saber qué opción me conviene' },
          { id: 'recaida', palabra: 'otra vez, después de usar ortodoncia' }
        ]
      },
      {
        id: 'color', palabra: 'no me gusta su color',
        glosa: 'El desgaste y las manchas a veces cuentan algo más: cómo muerdes, si aprietas de noche, qué tan ácida es tu dieta.',
        hojas: [
          { id: 'blanquear', palabra: 'y los quiero más blancos' },
          { id: 'manchas', palabra: 'por unas manchas que no se quitan' },
          { id: 'gastados', palabra: 'y se ven más cortos que antes' }
        ]
      }
    ]
  }
];

var WHATSAPP = '526221424577'; // demo. El del consultorio va aquí.
var ruta = [];

function tema() { return TEMAS.filter(function (t) { return t.id === ruta[0]; })[0]; }
function rama() { var t = tema(); return t && t.ramas.filter(function (r) { return r.id === ruta[1]; })[0]; }
function hoja() { var r = rama(); return r && r.hojas.filter(function (h) { return h.id === ruta[2]; })[0]; }
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

// La frase que se manda: exactamente lo que la persona compuso.
function frasePlana() {
  var t = tema(), r = rama(), h = hoja();
  if (!t) return '';
  var s = 'Quiero que revisen ' + t.palabra;
  if (r) s += ': ' + r.palabra;
  if (h) s += ' ' + h.palabra;
  return s + '.';
}

function recado() {
  var h = hoja();
  if (!h) return '';
  var l = ['Hola, doctora.', '', frasePlana()];
  if (h.urgente) l.push('', 'Entiendo que esto conviene revisarlo pronto.');
  l.push('', 'Me gustaría agendar una valoración.');
  return l.join('\n');
}

// ---------------------------------------------------------------
// La frase en pantalla, por tramos. Cada tramo escrito es un
// botón: tocarlo borra desde ahí para adelante.
// ---------------------------------------------------------------
function frasePintada() {
  var t = tema(), r = rama(), h = hoja();
  var p = '<h1 class="frase">Quiero que revisen ';

  p += t
    ? '<button type="button" class="escrito" data-accion="volver" data-nivel="0">' + esc(t.palabra) + '</button>'
    : '<span class="hueco">qué</span>';

  if (t) {
    p += ': ';
    p += r
      ? '<button type="button" class="escrito" data-accion="volver" data-nivel="1">' + esc(r.palabra) + '</button>'
      : '<span class="hueco">qué noto</span>';
  } else {
    p += '<span class="pendiente">: qué noto</span>';
  }

  if (r) {
    p += ' ';
    p += h
      ? '<button type="button" class="escrito" data-accion="volver" data-nivel="2">' + esc(h.palabra) + '</button>'
      : '<span class="hueco">en concreto</span>';
  } else if (t) {
    p += ' <span class="pendiente">en concreto</span>';
  }

  return p + '.</h1>';
}

function opciones(lista, accion) {
  return '<div class="opciones">' + lista.map(function (o) {
    return '<button type="button" class="opcion" data-accion="' + accion + '" data-valor="' + o.id + '">' +
      esc(o.palabra) +
      (o.urgente ? '<span class="alerta">verlo pronto</span>' : '') +
      '</button>';
  }).join('') + '</div>';
}

function render() {
  var out = frasePintada();
  var t = tema(), r = rama(), h = hoja();
  var paso = ruta.length + 1;

  if (!t) {
    out += opciones(TEMAS, 'tema');
    out += '<p class="glosa">No hace falta que sepas el nombre de lo que tienes. ' +
      'Elige lo que se parezca a lo tuyo y la frase se arma sola.</p>';
  } else if (!r) {
    out += opciones(t.ramas, 'rama');
    out += '<p class="glosa">' + esc(t.glosa) + '</p>';
  } else if (!h) {
    out += opciones(r.hojas, 'hoja');
    out += '<p class="glosa">' + esc(r.glosa) + '</p>';
  } else {
    // Final.
    var txt = recado();
    out += '<div class="final-acciones">' +
      '<a class="enviar' + (h.urgente ? ' enviar--urgente' : '') + '" ' +
      'href="https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(txt) + '" ' +
      'target="_blank" rel="noopener noreferrer">' +
      '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
      '<path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.17c-.24.68-1.42 1.3-1.96 1.35-.5.05-.95.23-3.2-.67-2.69-1.06-4.4-3.8-4.53-3.98-.13-.18-1.08-1.44-1.08-2.75s.69-1.95.93-2.22c.24-.27.53-.33.7-.33.18 0 .35 0 .5.01.16.01.38-.06.59.45.21.51.73 1.78.79 1.91.07.13.11.28.02.46-.09.18-.13.29-.26.45-.13.16-.28.35-.4.47-.13.13-.27.28-.12.54.15.27.67 1.1 1.43 1.78.98.87 1.81 1.14 2.07 1.27.26.13.41.11.56-.07.15-.18.64-.75.81-1.01.17-.26.34-.21.58-.13.24.09 1.51.71 1.77.84.26.13.43.2.5.31.06.11.06.63-.18 1.31z"/></svg>' +
      'Mandar esta frase</a>' +
      '<button type="button" class="reiniciar" data-accion="inicio">empezar de nuevo</button>' +
      '</div>';

    if (h.urgente) {
      out += '<p class="urgencia"><strong>Conviene verlo pronto.</strong> ' +
        'Manda la frase y márcanos al consultorio en vez de esperar la confirmación.</p>';
    }
    out += '<p class="sobre">Toca cualquier parte de la frase para cambiarla. ' +
      'Va a un número de prueba.</p>';
  }

  var app = document.getElementById('app');
  app.innerHTML = out;
  app.classList.remove('final');
  if (h) app.classList.add('final');

  document.getElementById('contador').textContent =
    String(Math.min(paso, 4)).padStart(2, '0') + ' / 04';
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-accion]');
  if (!b) return;
  var a = b.dataset.accion, v = b.dataset.valor;

  if (a === 'inicio') ruta = [];
  // Tocar un tramo escrito borra desde ese nivel en adelante.
  else if (a === 'volver') ruta = ruta.slice(0, Number(b.dataset.nivel));
  else if (a === 'tema') ruta = [v];
  else if (a === 'rama') ruta = [ruta[0], v];
  else if (a === 'hoja') ruta = [ruta[0], ruta[1], v];
  else return;

  render();
});

render();
</script>

</body>
</html>
