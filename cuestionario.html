<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Primera valoración — Dra. Daphne Amaral Alemán</title>
<meta name="description" content="Cuestionario previo a tu primera valoración. Toma 2 o 3 minutos.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400;500&display=swap">

<style>
/* ============================================================
   Dra. Daphne Amaral — Formulario de precalificación
   Layout: una columna, 560px, numeral + hairline + pregunta.
   Tokens: design system TSPU2e5nJp3SzqjQ4A5G47
   ============================================================ */
:root {
  --lino: #f7f4ef;
  --lino-alt: #efeae2;
  --tinta: #2a2622;
  --muted: #6b6560;
  --line: #e4ded4;
  --marron: #73594a;
  --agua: #3a635c;
  --agua-soft: #dce8e6;
  --sobre-agua: #ffffff;
  --exito: #3c6649;
  --error: #a14034;
  --error-soft: #f4e4e1;
  --foco: #3a635c;

  --font-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-sans: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;

  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;
  --radius-md: 8px;
  --radius-pill: 999px;
  --ease: cubic-bezier(.4, 0, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --lino: #1c1a17;      --lino-alt: #262320;
    --tinta: #f2ede4;     --muted: #a69e94;
    --line: #3a352f;      --marron: #c9a98f;
    --agua: #7fb5ab;      --agua-soft: #2b3b38;
    --sobre-agua: #1c1a17;
    --exito: #7fb58e;     --error: #e08a7c;  --error-soft: #3a2320;
    --foco: #7fb5ab;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --lino: #1c1a17;      --lino-alt: #262320;
  --tinta: #f2ede4;     --muted: #a69e94;
  --line: #3a352f;      --marron: #c9a98f;
  --agua: #7fb5ab;      --agua-soft: #2b3b38;
  --sobre-agua: #1c1a17;
  --exito: #7fb58e;     --error: #e08a7c;  --error-soft: #3a2320;
  --foco: #7fb5ab;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--lino);
  color: var(--tinta);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; border-radius: 2px; }

/* ---------- Estructura ---------- */
.marco {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: var(--space-12) 140px;
  min-height: 100%;
}
@media (min-width: 720px) { .marco { padding-block: var(--space-16) 160px; } }

.lockup {
  display: inline-flex; align-items: baseline; gap: 10px;
  margin-bottom: var(--space-12);
  text-decoration: none;
}
.mono {
  font-family: var(--font-display);
  font-size: 25px; font-weight: 400; line-height: 1;
  color: var(--marron);
}
.lockup-txt {
  font-size: 11px; font-weight: 500; letter-spacing: .15em;
  text-transform: uppercase; color: var(--muted);
}

/* ---------- Paso numerado (movimiento firma) ---------- */
.numeral {
  font-family: var(--font-display);
  font-size: 49px; font-weight: 300; line-height: 1;
  color: var(--marron); margin: 0;
  font-variant-numeric: tabular-nums;
}
.regla { width: 44px; height: 1px; background: var(--marron); border: 0; margin: var(--space-3) 0 var(--space-6); }
h1, h2 {
  font-family: var(--font-display);
  font-weight: 300; letter-spacing: -.01em;
  margin: 0; text-wrap: balance;
}
h1 { font-size: 39px; line-height: 1.15; }
h2 { font-size: 31px; line-height: 1.2; }
.sub {
  font-size: 16px; font-weight: 300; color: var(--muted);
  margin: var(--space-3) 0 0; max-width: 44ch;
}
.sub-lg { font-size: 20px; font-weight: 300; line-height: 1.55; }

/* ---------- Progreso ---------- */
.progreso { display: flex; gap: 6px; margin-bottom: var(--space-8); }
.punto { width: 24px; height: 2px; background: var(--line); border-radius: 1px; transition: background-color 240ms var(--ease); }
.punto--hecho { background: var(--marron); }
.punto--actual { background: var(--agua); }

/* ---------- Chips ---------- */
.pista { font-size: 14px; color: var(--muted); margin: var(--space-6) 0 0; }
.pista + .opciones { margin-top: var(--space-3); }
.opciones { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-8); }
.opciones--col { flex-direction: column; }

.chip, .chip-servicio {
  font-family: inherit; color: var(--tinta);
  background: transparent; border: 1px solid var(--line);
  cursor: pointer; text-align: left;
  transition: border-color 220ms var(--ease), background-color 220ms var(--ease);
}
.chip {
  font-size: 16px; border-radius: var(--radius-pill);
  padding: 11px var(--space-4); min-height: 44px;
}
.chip-servicio {
  display: block; width: 100%;
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
}
.chip-servicio .nombre { font-size: 16px; font-weight: 500; display: block; }
.chip-servicio .desc { font-size: 14px; color: var(--muted); display: block; margin-top: 2px; line-height: 1.5; }
.chip[aria-pressed="true"], .chip-servicio[aria-pressed="true"] {
  border-color: var(--agua); background: var(--agua-soft);
}
.chip[aria-pressed="true"] { font-weight: 500; }
@media (hover: hover) {
  .chip:hover, .chip-servicio:hover { border-color: var(--marron); }
}

/* ---------- Campos ---------- */
.campo { margin-bottom: var(--space-6); }
label { display: block; font-size: 16px; font-weight: 500; margin-bottom: var(--space-1); }
.req { color: var(--marron); }
input, textarea {
  display: block; width: 100%;
  padding: 13px var(--space-4);
  font-family: inherit; font-size: 16px; color: var(--tinta);
  background: transparent;
  border: 1px solid var(--line); border-radius: var(--radius-md);
  transition: border-color 200ms var(--ease);
}
input { min-height: 48px; }
textarea { resize: vertical; min-height: 92px; line-height: 1.6; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
input[aria-invalid="true"] { border-color: var(--error); }
.helper { font-size: 14px; color: var(--muted); margin: var(--space-1) 0 0; }
.error-msg {
  display: flex; align-items: flex-start; gap: 6px;
  font-size: 14px; color: var(--error); margin: var(--space-1) 0 0;
}
.error-msg svg { flex: none; margin-top: 3px; }

/* ---------- Avisos ---------- */
.aviso {
  display: flex; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-md);
  margin-top: var(--space-6);
}
.aviso p { margin: 0; font-size: 15px; line-height: 1.55; }
.aviso svg { flex: none; margin-top: 2px; }
.aviso--urgencia { background: var(--error-soft); color: var(--error); }
.aviso--urgencia .cuerpo { color: var(--tinta); margin-top: 3px; }
.aviso--urgencia .t { font-weight: 500; }
.aviso--privacidad { border: 1px solid var(--line); color: var(--muted); }
.aviso--privacidad a { color: var(--marron); }

/* ---------- Barra de acción ---------- */
.barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--lino);
  border-top: 1px solid var(--line);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-top: var(--space-4);
  padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom, 0px));
}
.barra-inner {
  max-width: 560px; margin: 0 auto;
  display: flex; align-items: center; gap: var(--space-4);
}
.btn {
  font-family: inherit; font-size: 16px; font-weight: 500;
  min-height: 48px; padding: 0 28px;
  border-radius: var(--radius-pill); border: 1px solid transparent;
  cursor: pointer;
  transition: transform 160ms var(--ease), opacity 200ms var(--ease);
}
.btn:active:not([disabled]) { transform: scale(.975); }
.btn--primario { background: var(--agua); color: var(--sobre-agua); flex: 1; }
.btn--secundario { background: transparent; color: var(--tinta); border-color: var(--line); padding: 0 20px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.conteo { font-size: 14px; color: var(--muted); margin-left: auto; }

/* ---------- Transición entre pasos ---------- */
.pantalla { animation: entra 280ms var(--ease) both; }
@keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- Resumen y gracias ---------- */
.resumen { margin-top: var(--space-8); border-top: 1px solid var(--line); }
.linea { display: flex; gap: var(--space-4); padding: var(--space-3) 0; border-bottom: 1px solid var(--line); }
.linea dt { font-size: 14px; color: var(--muted); flex: none; width: 128px; }
.linea dd { margin: 0; font-size: 15px; }
.marcado { color: var(--error); font-weight: 500; }
.marca-gracias {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--agua-soft); color: var(--agua);
  display: grid; place-items: center; margin-bottom: var(--space-6);
}
.placeholder {
  border: 1px dashed var(--line); border-radius: var(--radius-md);
  padding: var(--space-4); margin-top: var(--space-8);
  font-size: 13px; color: var(--muted); line-height: 1.6;
}
.placeholder strong { color: var(--marron); font-weight: 500; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div class="marco">
  <a class="lockup" href="index.html" aria-label="Volver al inicio">
    <span class="mono" aria-hidden="true">DA</span>
    <span class="lockup-txt">Dra. Daphne Amaral Alemán</span>
  </a>
  <main id="app" aria-live="polite"></main>
</div>

<div class="barra" id="barra"></div>

<script>
// ---------------------------------------------------------------
// Datos: los 9 servicios del cuestionario, con su pregunta condicional.
// Un décimo servicio se agrega aquí y nada más cambia.
// ---------------------------------------------------------------
var SERVICIOS = [
  { id: 'limpieza', nombre: 'Limpieza y prevención', desc: 'Revisión, limpieza, salud de encías y mantenimiento.',
    pregunta: '¿Cuándo fue tu última limpieza dental?',
    opciones: ['Menos de 6 meses', '6–12 meses', 'Más de un año', 'No recuerdo'] },
  { id: 'resinas', nombre: 'Resinas y restauraciones', desc: 'Caries, dientes fracturados o restauraciones antiguas.',
    pregunta: '¿Qué te gustaría revisar?', varias: true,
    opciones: ['Posible caries', 'Diente fracturado', 'Resina deteriorada', 'Molestia o sensibilidad'],
    urgentes: ['Diente fracturado'] },
  { id: 'blanqueamiento', nombre: 'Blanqueamiento dental', desc: 'Mejorar el color de los dientes.',
    pregunta: '¿Qué te gustaría conseguir?', varias: true,
    opciones: ['Un tono más blanco', 'Eliminar manchas', 'Preparar mi sonrisa para un evento', 'Conocer opciones'] },
  { id: 'invisalign', nombre: 'Invisalign', desc: 'Tratamiento con alineadores transparentes.',
    pregunta: '¿Has utilizado ortodoncia anteriormente?',
    opciones: ['Nunca', 'Sí, brackets', 'Sí, alineadores', 'Actualmente en tratamiento'] },
  { id: 'ortodoncia', nombre: 'Ortodoncia convencional', desc: 'Brackets, alineación y problemas de mordida.',
    pregunta: '¿Qué te preocupa principalmente?', varias: true,
    opciones: ['Dientes desalineados', 'Mi mordida', 'Espacios entre dientes', 'Valoración completa'] },
  { id: 'infantil', nombre: 'Odontología y ortodoncia infantil', desc: 'Crecimiento, desarrollo dental y maloclusiones.',
    pregunta: '¿Qué has observado?', varias: true,
    opciones: ['Dientes encimados', 'Problemas al morder', 'Hábitos orales o respiración bucal', 'Revisar desarrollo'] },
  { id: 'sueno', nombre: 'Respiración y sueño', desc: 'Respiración oral, ronquidos y síntomas relacionados.',
    pregunta: '¿Qué síntomas has observado?', varias: true,
    opciones: ['Respiración por la boca', 'Ronquidos', 'Dificultad nasal', 'Sueño inquieto'] },
  { id: 'atm', nombre: 'ATM y dolor mandibular', desc: 'Dolor, ruidos, bloqueos o limitación de apertura.',
    pregunta: '¿Qué molestias presentas?', varias: true,
    opciones: ['Dolor mandibular', 'Ruidos o chasquidos', 'Dificultad para abrir', 'Bloqueo mandibular'],
    urgentes: ['Dificultad para abrir', 'Bloqueo mandibular'] },
  { id: 'integral', nombre: 'Valoración dental integral', desc: 'Revisión general o varias necesidades a la vez.',
    pregunta: '¿Cuál es el objetivo de tu visita?', varias: true,
    opciones: ['Revisión preventiva', 'Varias molestias', 'Mejorar mi sonrisa', 'Plan integral'] }
];

var PARA_QUIEN = ['Adulto', 'Adolescente', 'Niño o niña'];
var MEDIOS = ['WhatsApp', 'Llamada', 'Correo'];

// ---------------------------------------------------------------
// Estado
// ---------------------------------------------------------------
var estado = {
  paso: 0,            // 0 bienvenida · 1 quién · 2 servicios · 3..n condicionales · contacto · gracias
  paraQuien: '',
  nombre: '',
  elegidos: [],       // ids de servicio
  respuestas: {},     // id -> opción
  tel: '', correo: '', medio: '', comentario: '',
  errores: {}
};

function serviciosElegidos() {
  return SERVICIOS.filter(function (s) { return estado.elegidos.indexOf(s.id) !== -1; });
}
// Las respuestas se guardan siempre como arreglo, lleve el servicio
// una o varias opciones. Así el resto del código no se ramifica.
function resp(id) { return estado.respuestas[id] || []; }
function respondido(id) { return resp(id).length > 0; }

function hayUrgencia() {
  return serviciosElegidos().some(function (s) {
    return s.urgentes && s.urgentes.some(function (u) { return resp(s.id).indexOf(u) !== -1; });
  });
}
function urgentesDe(s) {
  return s.urgentes ? s.urgentes.filter(function (u) { return resp(s.id).indexOf(u) !== -1; }) : [];
}
// Pantallas: 0 bienvenida, 1 quién, 2 servicios, luego una por servicio, luego contacto, luego gracias
function totalPantallas() { return 3 + estado.elegidos.length + 2; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

// ---------------------------------------------------------------
// Piezas
// ---------------------------------------------------------------
function progreso() {
  var total = totalPantallas() - 1;           // la de gracias no cuenta
  var actual = estado.paso;
  var p = '<div class="progreso" role="img" aria-label="Paso ' + (actual + 1) + ' de ' + total + '">';
  for (var i = 0; i < total; i++) {
    var cls = i < actual ? ' punto--hecho' : (i === actual ? ' punto--actual' : '');
    p += '<span class="punto' + cls + '"></span>';
  }
  return p + '</div>';
}
function cabecera(num, pregunta, sub) {
  return '<p class="numeral">' + String(num).padStart(2, '0') + '</p>' +
    '<hr class="regla">' +
    '<h2>' + esc(pregunta) + '</h2>' +
    (sub ? '<p class="sub">' + esc(sub) + '</p>' : '');
}
// `seleccion` admite un valor suelto o un arreglo: una sola rama de render
// para las preguntas de una respuesta y las de varias.
function chips(opciones, seleccion, accion) {
  var sel = Array.isArray(seleccion) ? seleccion : (seleccion ? [seleccion] : []);
  return '<div class="opciones">' + opciones.map(function (o) {
    return '<button type="button" class="chip" aria-pressed="' + (sel.indexOf(o) !== -1) +
      '" data-accion="' + accion + '" data-valor="' + esc(o) + '">' + esc(o) + '</button>';
  }).join('') + '</div>';
}
var ICONO_ALERTA = '<svg width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
  '<path d="M8 1.8 1.4 13.4h13.2L8 1.8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>' +
  '<path d="M8 6.4v3M8 11.4v.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
var ICONO_ERROR = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
  '<circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/>' +
  '<path d="M8 4.6v4.2M8 11.2v.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';

function campoError(campo) {
  if (!estado.errores[campo]) return '';
  return '<p class="error-msg" role="alert">' + ICONO_ERROR + '<span>' + esc(estado.errores[campo]) + '</span></p>';
}

// ---------------------------------------------------------------
// Pantallas
// ---------------------------------------------------------------
function pantalla() {
  var p = estado.paso;
  var nCond = estado.elegidos.length;

  if (p === 0) {
    return '<div class="pantalla">' +
      '<h1>Tu sonrisa es mucho más que dientes alineados.</h1>' +
      '<p class="sub sub-lg">Cuéntanos qué te gustaría mejorar o revisar. Tus respuestas ' +
      'nos ayudan a preparar tu primera valoración.</p>' +
      '<p class="sub" style="margin-top:var(--space-6)">Toma 2 o 3 minutos. No es una historia clínica: ' +
      'eso lo vemos juntos en el consultorio.</p>' +
      '<div class="placeholder"><strong>Aquí va una foto.</strong> Retrato de la Dra. en luz natural, ' +
      'ligeramente desaturado, grano fino. Nunca una foto clínica en esta pantalla.</div>' +
      '</div>';
  }

  if (p === 1) {
    return '<div class="pantalla">' + progreso() +
      cabecera(1, '¿Para quién es la consulta?') +
      chips(PARA_QUIEN, estado.paraQuien, 'paraQuien') +
      '<div class="campo" style="margin-top:var(--space-8)">' +
      '<label for="nombre">Nombre del paciente <span class="req" aria-hidden="true">*</span></label>' +
      '<input id="nombre" type="text" autocomplete="name" value="' + esc(estado.nombre) + '"' +
      (estado.errores.nombre ? ' aria-invalid="true"' : '') + '>' +
      campoError('nombre') +
      '</div>' +
      (estado.paraQuien === 'Niño o niña' || estado.paraQuien === 'Adolescente'
        ? '<div class="aviso aviso--privacidad"><p>Para pacientes menores de edad pediremos ' +
          'los datos de la madre, padre o tutor al agendar.</p></div>' : '') +
      '</div>';
  }

  if (p === 2) {
    return '<div class="pantalla">' + progreso() +
      cabecera(2, '¿Cómo podemos ayudarte?', 'Puedes elegir más de una. Solo te preguntamos por lo que marques.') +
      '<div class="opciones opciones--col">' + SERVICIOS.map(function (s) {
        var on = estado.elegidos.indexOf(s.id) !== -1;
        return '<button type="button" class="chip-servicio" aria-pressed="' + on +
          '" data-accion="servicio" data-valor="' + s.id + '">' +
          '<span class="nombre">' + esc(s.nombre) + '</span>' +
          '<span class="desc">' + esc(s.desc) + '</span></button>';
      }).join('') + '</div></div>';
  }

  // Pantallas condicionales
  if (p >= 3 && p < 3 + nCond) {
    var s = serviciosElegidos()[p - 3];
    var marcados = urgentesDe(s);
    return '<div class="pantalla">' + progreso() +
      cabecera(p, s.pregunta, s.nombre) +
      (s.varias ? '<p class="pista">Marca todas las que apliquen.</p>' : '') +
      chips(s.opciones, resp(s.id), 'respuesta:' + s.id) +
      (marcados.length ? '<div class="aviso aviso--urgencia" role="alert">' + ICONO_ALERTA +
        '<div><p class="t">Esto conviene verlo pronto</p>' +
        '<p class="cuerpo">Por lo que nos cuentas, es mejor que te valoren antes que en una cita ' +
        'de rutina. Termina el formulario y llámanos al consultorio para buscar espacio.</p></div></div>' : '') +
      '</div>';
  }

  // Contacto
  if (p === 3 + nCond) {
    return '<div class="pantalla">' + progreso() +
      cabecera(p, '¿Cómo te contactamos?', 'Para confirmar tu cita y resolver dudas antes de que vengas.') +
      '<div style="margin-top:var(--space-8)">' +
      '<div class="campo">' +
      '<label for="tel">Teléfono o WhatsApp <span class="req" aria-hidden="true">*</span></label>' +
      '<input id="tel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="33 1234 5678" ' +
      'value="' + esc(estado.tel) + '"' + (estado.errores.tel ? ' aria-invalid="true"' : '') + '>' +
      (estado.errores.tel ? campoError('tel') : '<p class="helper">Te escribimos por aquí para confirmar.</p>') +
      '</div>' +
      '<div class="campo">' +
      '<label for="correo">Correo electrónico</label>' +
      '<input id="correo" type="email" inputmode="email" autocomplete="email" value="' + esc(estado.correo) + '">' +
      '<p class="helper">Opcional.</p>' +
      '</div>' +
      '<div class="campo"><label id="lbl-medio">¿Cómo prefieres que te busquemos?</label>' +
      '<div class="opciones" style="margin-top:var(--space-2)" role="group" aria-labelledby="lbl-medio">' +
      MEDIOS.map(function (m) {
        return '<button type="button" class="chip" aria-pressed="' + (m === estado.medio) +
          '" data-accion="medio" data-valor="' + m + '">' + m + '</button>';
      }).join('') + '</div></div>' +
      '<div class="campo"><label for="comentario">¿Algo más que quieras contarnos?</label>' +
      '<textarea id="comentario" rows="3" placeholder="Opcional">' + esc(estado.comentario) + '</textarea></div>' +
      '</div>' +
      '<div class="aviso aviso--privacidad">' +
      '<svg width="17" height="17" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
      '<rect x="3.2" y="7" width="9.6" height="7.2" rx="1.4" stroke="currentColor" stroke-width="1.3"/>' +
      '<path d="M5.6 7V4.9a2.4 2.4 0 0 1 4.8 0V7" stroke="currentColor" stroke-width="1.3"/></svg>' +
      '<p>Tus respuestas son información de salud y se tratan como tal. Solo las ve la Dra. Amaral ' +
      'y su equipo. <a href="#" onclick="return false">Aviso de privacidad</a>.</p></div>' +
      '<div class="placeholder"><strong>Pendiente legal.</strong> Aquí va la casilla de consentimiento ' +
      'y el texto del aviso bajo la LFPDPPP. Son datos sensibles de salud: lo redacta quien corresponda.</div>' +
      '</div>';
  }

  // Gracias
  var dl = serviciosElegidos().map(function (s) {
    var r = resp(s.id), urg = urgentesDe(s);
    var texto = r.length ? r.map(function (o) {
      return urg.indexOf(o) !== -1
        ? '<span class="marcado">' + esc(o) + '</span>' : esc(o);
    }).join(' · ') : '—';
    return '<div class="linea"><dt>' + esc(s.nombre) + '</dt><dd>' + texto + '</dd></div>';
  }).join('');
  return '<div class="pantalla">' +
    '<div class="marca-gracias" aria-hidden="true">' +
    '<svg width="26" height="26" viewBox="0 0 24 24" fill="none">' +
    '<path d="M5 12.5 10 17.5 19 7" stroke="currentColor" stroke-width="1.6" ' +
    'stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
    '<h1>Gracias, ' + esc((estado.nombre || '').split(' ')[0] || 'nos vemos pronto') + '.</h1>' +
    '<p class="sub sub-lg">Ya sabemos qué te trae. En tu valoración revisamos tu salud bucal ' +
    'y te explicamos las alternativas que tienen sentido para ti.</p>' +
    (hayUrgencia() ? '<div class="aviso aviso--urgencia" role="alert">' + ICONO_ALERTA +
      '<div><p class="t">Llámanos directo</p><p class="cuerpo">Por lo que marcaste, conviene ' +
      'adelantar tu cita. Márcanos al consultorio en lugar de esperar la confirmación.</p></div></div>' : '') +
    '<div class="resumen"><dl style="margin:0">' +
    '<div class="linea"><dt>Paciente</dt><dd>' + esc(estado.nombre || '—') + '</dd></div>' +
    '<div class="linea"><dt>Consulta para</dt><dd>' + esc(estado.paraQuien || '—') + '</dd></div>' +
    dl +
    '<div class="linea"><dt>Contacto</dt><dd>' + esc(estado.tel || '—') +
    (estado.medio ? ' · ' + esc(estado.medio) : '') + '</dd></div>' +
    '</dl></div>' +
    '<div class="placeholder"><strong>Aquí termina la demostración.</strong> En la versión real, este ' +
    'paso abre WhatsApp con el resumen listo para enviar y guarda una copia en la hoja del ' +
    'consultorio. Nada de esto se envía todavía. ' +
    '<a href="index.html" style="color:var(--marron)">Volver al inicio</a>.</div>' +
    '</div>';
}

// ---------------------------------------------------------------
// Barra de acción
// ---------------------------------------------------------------
function barra() {
  var p = estado.paso, nCond = estado.elegidos.length, ultimo = totalPantallas() - 1;
  if (p === ultimo) {
    return '<div class="barra-inner"><button type="button" class="btn btn--primario" ' +
      'data-accion="reiniciar">Ver el formulario otra vez</button></div>';
  }
  var texto = p === 0 ? 'Empezar'
    : (p === 3 + nCond ? 'Agendar mi primera valoración' : 'Continuar');
  var listo = true;
  if (p === 1) listo = !!estado.paraQuien && estado.nombre.trim().length > 1;
  if (p === 2) listo = estado.elegidos.length > 0;
  if (p >= 3 && p < 3 + nCond) listo = respondido(serviciosElegidos()[p - 3].id);
  if (p === 3 + nCond) listo = estado.tel.replace(/\D/g, '').length >= 10;

  return '<div class="barra-inner">' +
    (p > 0 ? '<button type="button" class="btn btn--secundario" data-accion="atras">Atrás</button>' : '') +
    '<button type="button" class="btn btn--primario" data-accion="siguiente"' +
    (listo ? '' : ' disabled') + '>' + texto + '</button>' +
    (p === 2 && estado.elegidos.length
      ? '<span class="conteo">' + estado.elegidos.length + ' elegido' +
        (estado.elegidos.length > 1 ? 's' : '') + '</span>' : '') +
    '</div>';
}

// ---------------------------------------------------------------
// Render y eventos
// ---------------------------------------------------------------
// Redibuja la pantalla entera. Solo al cambiar de paso: reinicia la
// animación y sube el scroll, que es justo lo que no debe pasar al
// marcar una opción.
function render() {
  document.getElementById('app').innerHTML = pantalla();
  document.getElementById('barra').innerHTML = barra();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// Marcar una opción no es cambiar de pantalla: se tocan solo los chips
// afectados, la barra y el aviso de urgencia. Sin fade, sin salto.
function refrescarSeleccion(accion) {
  // Qué está marcado ahora mismo, según el grupo que se tocó.
  var marcados;
  if (accion === 'paraQuien') marcados = estado.paraQuien ? [estado.paraQuien] : [];
  else if (accion === 'medio') marcados = estado.medio ? [estado.medio] : [];
  else if (accion === 'servicio') marcados = estado.elegidos;
  else if (accion.indexOf('respuesta:') === 0) marcados = resp(accion.slice(10));
  else marcados = [];

  document.querySelectorAll('[data-accion="' + accion + '"]').forEach(function (b) {
    b.setAttribute('aria-pressed', marcados.indexOf(b.dataset.valor) !== -1);
  });

  if (accion.indexOf('respuesta:') === 0) {
    var serv = SERVICIOS.filter(function (s) { return s.id === accion.slice(10); })[0];
    if (serv) sincronizarUrgencia(serv);
  }
  // Elegir servicios cambia cuántos pasos habrá: el progreso se recalcula.
  if (accion === 'servicio') {
    var caja = document.querySelector('.progreso');
    if (caja) caja.outerHTML = progreso();
  }
  document.getElementById('barra').innerHTML = barra();
}

// El aviso aparece o desaparece sin redibujar la pregunta.
function sincronizarUrgencia(serv) {
  var hay = urgentesDe(serv).length > 0;
  var actual = document.querySelector('.pantalla .aviso--urgencia');
  if (hay && !actual) {
    var caja = document.createElement('div');
    caja.className = 'aviso aviso--urgencia';
    caja.setAttribute('role', 'alert');
    caja.innerHTML = ICONO_ALERTA +
      '<div><p class="t">Esto conviene verlo pronto</p>' +
      '<p class="cuerpo">Por lo que nos cuentas, es mejor que te valoren antes que en una cita ' +
      'de rutina. Termina el formulario y llámanos al consultorio para buscar espacio.</p></div>';
    document.querySelector('.pantalla').appendChild(caja);
  } else if (!hay && actual) {
    actual.remove();
  }
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-accion]');
  if (!b) return;
  var a = b.dataset.accion, v = b.dataset.valor;

  // Marcar una opción nunca redibuja la pantalla; cambiar de paso, sí.
  if (a === 'paraQuien') {
    var antes = estado.paraQuien;
    estado.paraQuien = antes === v ? '' : v;
    // El aviso de tutor depende de esta respuesta: ahí sí hay que redibujar.
    var tutorAntes = antes === 'Niño o niña' || antes === 'Adolescente';
    var tutorAhora = estado.paraQuien === 'Niño o niña' || estado.paraQuien === 'Adolescente';
    if (tutorAntes !== tutorAhora) return render();
    return refrescarSeleccion('paraQuien');
  }
  if (a === 'medio') {
    estado.medio = estado.medio === v ? '' : v;
    return refrescarSeleccion('medio');
  }
  if (a === 'servicio') {
    var i = estado.elegidos.indexOf(v);
    if (i === -1) estado.elegidos.push(v);
    else { estado.elegidos.splice(i, 1); delete estado.respuestas[v]; }
    // Conserva el orden del cuestionario, no el orden de toque.
    estado.elegidos.sort(function (x, y) {
      return SERVICIOS.findIndex(function (s) { return s.id === x; }) -
             SERVICIOS.findIndex(function (s) { return s.id === y; });
    });
    return refrescarSeleccion('servicio');
  }
  if (a.indexOf('respuesta:') === 0) {
    var id = a.slice(10);
    var serv = SERVICIOS.filter(function (s) { return s.id === id; })[0];
    var actual = resp(id), j = actual.indexOf(v);
    if (!serv.varias) {
      // Una sola respuesta: volver a tocarla la quita.
      estado.respuestas[id] = j !== -1 ? [] : [v];
    } else if (j !== -1) {
      estado.respuestas[id] = actual.filter(function (o) { return o !== v; });
    } else {
      // Conserva el orden en que se listan las opciones, no el de los toques.
      estado.respuestas[id] = serv.opciones.filter(function (o) {
        return o === v || actual.indexOf(o) !== -1;
      });
    }
    return refrescarSeleccion(a);
  }
  if (a === 'siguiente') {
    if (estado.paso === 1) {
      if (estado.nombre.trim().length < 2) {
        estado.errores.nombre = 'Nos falta tu nombre — así sabemos con quién hablamos.';
        return render();
      }
      delete estado.errores.nombre;
    }
    if (estado.paso === 3 + estado.elegidos.length) {
      if (estado.tel.replace(/\D/g, '').length < 10) {
        estado.errores.tel = 'Ese número no se ve completo. Revisa que tenga 10 dígitos.';
        return render();
      }
      delete estado.errores.tel;
    }
    estado.paso++;
  }
  else if (a === 'atras') { estado.paso--; }
  else if (a === 'reiniciar') {
    estado = { paso: 0, paraQuien: '', nombre: '', elegidos: [], respuestas: {},
               tel: '', correo: '', medio: '', comentario: '', errores: {} };
  }
  render();
});

// Los campos de texto no re-renderizan al teclear: solo guardan.
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'nombre') estado.nombre = t.value;
  if (t.id === 'tel') estado.tel = t.value;
  if (t.id === 'correo') estado.correo = t.value;
  if (t.id === 'comentario') estado.comentario = t.value;

  // Habilita el botón sin redibujar el campo (perdería el foco).
  var p = estado.paso, listo = false;
  if (p === 1) listo = !!estado.paraQuien && estado.nombre.trim().length > 1;
  else if (p === 3 + estado.elegidos.length) listo = estado.tel.replace(/\D/g, '').length >= 10;
  else return;
  var btn = document.querySelector('[data-accion="siguiente"]');
  if (btn) btn.disabled = !listo;
});

// Validación al salir del campo, nunca al teclear.
document.addEventListener('blur', function (e) {
  if (e.target.id === 'nombre' && estado.nombre.trim().length >= 2 && estado.errores.nombre) {
    delete estado.errores.nombre; render();
  }
  if (e.target.id === 'tel' && estado.tel.replace(/\D/g, '').length >= 10 && estado.errores.tel) {
    delete estado.errores.tel; render();
  }
}, true);

render();
</script>
