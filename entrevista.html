<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu primera valoración — Dra. Daphne Amaral Alemán</title>
<meta name="description" content="Elige qué te gustaría revisar y contesta unas preguntas cortas. Odontología integral y ortodoncia en Guadalajara.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap">

<style>
/* ============================================================
   Tu primera valoración
   Flujo que pidió la Dra.: eliges servicios y luego contestas
   preguntas cortas de cada uno. Una pregunta por pantalla; la
   entrevista (P. / R.) se escribe al lado y es lo que se envía.
   Regla de texto: preguntas de una línea, opciones de pocas
   palabras, sin párrafos de explicación.
   Contrastes verificados sobre blanco: todo AA o AAA.
   ============================================================ */
:root {
  --papel: #ffffff;
  --tinta: #191714;        /* 17.89:1 */
  --gris: #55504a;         /*  7.98:1 */
  --rotulo: #6b655d;       /*  5.76:1 */
  --firma: #6b5244;        /*  7.20:1 */
  --accion: #1f5e52;       /*  7.55:1 */
  --accion-hover: #17483f;
  --alarma: #962f20;       /*  7.71:1 */
  --linea: #d8d3cb;        /*  divisor, nunca texto */
  --linea-fina: #efebe6;
  --tenue: #f6f4f1;
  --marcado: #eef4f2;
  --sobre-accion: #ffffff;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --sans: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
}

/* ---------- Ambiente por servicio ---------- */
/* Respiración y sueño: de noche. Verificado sobre #12161b. */
:root[data-tema="noche"] {
  --papel: #12161b;
  --tinta: #ece8e1;        /* 14.87:1 */
  --gris: #b5afa7;         /*  8.35:1 */
  --rotulo: #9d968d;       /*  6.21:1 */
  --firma: #d2b39b;        /*  9.22:1 */
  --accion: #86bdb2;       /*  8.59:1 */
  --accion-hover: #a2cfc6;
  --alarma: #ef9a88;       /*  8.34:1 */
  --linea: #2f353d;
  --linea-fina: #20252b;
  --tenue: #1b2026;
  --marcado: #1d2a2a;
  --sobre-accion: #12161b;
  color-scheme: dark;
}
/* Estética e Invisalign: el más luminoso. Verificado sobre #fbf8f3. */
:root[data-tema="luz"] { --papel: #fbf8f3; --tenue: #f3eee6; --linea-fina: #ece6dd; }

html { background: var(--papel); transition: background-color 700ms var(--ease); }
*, *::before, *::after { box-sizing: border-box; }

button {
  font: inherit; color: inherit; background: none; border: 0;
  margin: 0; padding: 0; text-align: left; cursor: pointer;
  -webkit-appearance: none; appearance: none;
}
input, textarea { font: inherit; color: inherit; }

body {
  margin: 0;
  background: var(--papel);
  color: var(--tinta);
  font-family: var(--sans);
  font-size: 16px;
  font-weight: 300;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background-color 700ms var(--ease), color 700ms var(--ease);
}
:focus-visible { outline: 2px solid var(--accion); outline-offset: 3px; }

.marco {
  max-width: 1200px;
  margin: 0 auto;
  padding-left: max(22px, env(safe-area-inset-left, 0px));
  padding-right: max(22px, env(safe-area-inset-right, 0px));
}

.banda { background: #191714; color: #fff; font-size: 12.5px; line-height: 1.5; padding-block: 10px; }
.banda strong { font-weight: 500; }

.cabecera {
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  padding-block: 18px 14px;
  border-bottom: 1px solid var(--tinta);
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--rotulo);
}
.cabecera a { color: var(--firma); text-decoration: none; }
.cabecera .folio { margin-left: auto; color: var(--tinta); font-variant-numeric: tabular-nums; }

/* ---------- Escena ---------- */
.escena { display: grid; }
@media (min-width: 960px) {
  .escena { grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 72px; }
}
.escenario {
  min-height: calc(100vh - 140px);
  padding-block: clamp(32px, 6vh, 72px) 140px;
  display: flex; flex-direction: column;
}
@media (min-width: 960px) { .escenario { padding-bottom: 80px; } }

.entra { animation: entra 420ms var(--ease) both; }
@keyframes entra { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.posicion {
  display: block;
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--rotulo);
}
.posicion b { font-weight: 500; color: var(--firma); }
.puntos { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.punto { display: block; width: 22px; height: 2px; background: var(--linea); }
.punto--hecho { background: var(--firma); }
.punto--actual { background: var(--tinta); }

.pregunta {
  font-family: var(--display); font-weight: 300;
  font-size: clamp(32px, 5.2vw, 58px);
  line-height: 1.07; letter-spacing: -.022em;
  margin: 18px 0 0; max-width: 18ch; text-wrap: balance;
}
.indicacion {
  font-size: 16px; line-height: 1.5; color: var(--gris);
  margin: 12px 0 0; max-width: 44ch;
}

/* ---------- Respuestas ---------- */
.respuestas { margin-top: clamp(24px, 4vh, 40px); border-top: 1px solid var(--linea); max-width: 640px; }
.r {
  display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center;
  width: 100%; padding: 15px 0;
  border-bottom: 1px solid var(--linea);
  transition: padding-left 300ms var(--ease), background-color 200ms var(--ease);
  position: relative;
}
.r::before {
  content: ""; position: absolute; left: 0; top: -1px; bottom: -1px; width: 0;
  background: var(--tinta); transition: width 300ms var(--ease);
}
.r-tecla {
  display: block;
  font-size: 12px; font-weight: 500; color: var(--rotulo);
  font-variant-numeric: tabular-nums;
}
.r-texto {
  display: block;
  font-family: var(--display); font-weight: 300;
  font-size: clamp(21px, 2.6vw, 27px); line-height: 1.2; letter-spacing: -.012em;
}
@media (hover: hover) {
  .r:hover { padding-left: 18px; }
  .r:hover::before { width: 3px; }
}
.r[aria-pressed="true"] { padding-left: 18px; background: var(--marcado); }
.r[aria-pressed="true"]::before { width: 3px; background: var(--accion); }
.r[aria-pressed="true"] .r-tecla { color: var(--accion); }

/* Casilla para preguntas de varias respuestas */
.casilla {
  display: grid; place-items: center;
  width: 20px; height: 20px; border: 1px solid var(--gris);
  transition: background-color 180ms var(--ease), border-color 180ms var(--ease);
}
.casilla svg { opacity: 0; }
.r[aria-pressed="true"] .casilla { background: var(--accion); border-color: var(--accion); }
.r[aria-pressed="true"] .casilla svg { opacity: 1; }
.r-alarma { display: block; font-family: var(--sans); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--alarma); margin-top: 3px; }

.aviso {
  margin-top: 22px; padding-left: 15px; border-left: 3px solid var(--alarma);
  font-size: 15px; line-height: 1.55; max-width: 52ch;
}
.aviso b { color: var(--alarma); font-weight: 500; }

/* ---------- Servicios: el catálogo de la Dra. ---------- */
.grupos { margin-top: clamp(24px, 4vh, 40px); max-width: 860px; }
.grupo-rotulo {
  display: block;
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--rotulo);
  padding-bottom: 8px; border-bottom: 1px solid var(--tinta); margin-top: 26px;
}
.grupo-rotulo:first-child { margin-top: 0; }
.servicios { display: grid; grid-template-columns: 1fr; }
@media (min-width: 640px) { .servicios { grid-template-columns: 1fr 1fr; column-gap: 28px; } }
.servicio {
  display: grid; grid-template-columns: 22px 1fr; gap: 14px; align-items: start;
  width: 100%; padding: 15px 0 15px 0;
  border-bottom: 1px solid var(--linea);
  transition: padding-left 260ms var(--ease), background-color 200ms var(--ease);
}
.servicio .casilla { margin-top: 4px; }
.servicio[aria-pressed="true"] { background: var(--marcado); padding-left: 12px; }
.servicio[aria-pressed="true"] .casilla { background: var(--accion); border-color: var(--accion); }
.servicio[aria-pressed="true"] .casilla svg { opacity: 1; }
@media (hover: hover) { .servicio:hover { padding-left: 12px; } }
.servicio-nombre {
  display: block;
  font-family: var(--display); font-weight: 400;
  font-size: clamp(21px, 2.4vw, 25px); line-height: 1.15; letter-spacing: -.01em;
}
.servicio-desc { display: block; font-size: 14px; line-height: 1.45; color: var(--gris); margin-top: 3px; }

/* Botón fijo para continuar cuando se eligen varias cosas */
.continuar-fila {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  margin-top: 26px;
}
.contador { font-size: 14px; color: var(--gris); }
/* En la lista de servicios el botón se queda a la vista mientras bajas. */
.continuar-fila--fija {
  position: sticky; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  background: var(--papel); padding-block: 14px; margin-top: 0;
  border-top: 1px solid var(--linea);
}
@media (min-width: 960px) { .continuar-fila--fija { bottom: 0; } }

.btn {
  display: inline-flex; align-items: center; gap: 10px;
  min-height: 54px; padding: 0 28px;
  background: var(--accion); color: var(--sobre-accion); font-size: 16px; font-weight: 500;
  text-decoration: none; transition: background-color 220ms var(--ease), transform 160ms var(--ease), opacity 220ms var(--ease);
}
.btn:active { transform: scale(.985); }
@media (hover: hover) { .btn:hover { background: var(--accion-hover); } }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn[disabled]:active { transform: none; }
.btn--alarma { background: var(--alarma); }
@media (hover: hover) { .btn--alarma:hover { background: var(--alarma); opacity: .86; } }
.enlace {
  font-size: 15px; color: var(--gris);
  text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--linea);
  padding: 8px 2px;
}
@media (hover: hover) { .enlace:hover { color: var(--tinta); } }
.atras {
  margin-top: auto; padding-top: 32px;
  font-size: 14px; color: var(--gris);
  text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--linea);
  align-self: flex-start;
}

/* ---------- Datos ---------- */
.campos { display: grid; gap: 22px; margin-top: 28px; max-width: 480px; }
.campo label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.campo input, .campo textarea {
  display: block; width: 100%;
  font-family: var(--display); font-weight: 300; font-size: 24px;
  border: 0; border-bottom: 1px solid var(--tinta); padding: 4px 0 8px;
  background: transparent; border-radius: 0;
}
.campo textarea { font-size: 20px; resize: vertical; min-height: 70px; line-height: 1.4; }
.campo input::placeholder, .campo textarea::placeholder { color: var(--rotulo); opacity: 1; }
.campo input:focus, .campo textarea:focus { outline: none; border-bottom: 2px solid var(--accion); padding-bottom: 7px; }
.campo .nota { display: block; font-size: 13px; color: var(--gris); margin-top: 5px; }

/* ---------- Final ---------- */
.recado { margin-top: 28px; border: 1px solid var(--tinta); max-width: 620px; }
.recado-cabeza {
  display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--rotulo); padding: 11px 18px; border-bottom: 1px solid var(--linea);
}
.recado-texto { margin: 0; padding: 18px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
.botones { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 26px; }
.legal { font-size: 13px; line-height: 1.55; color: var(--gris); margin-top: 26px; max-width: 58ch; }

/* ---------- Transcripción ---------- */
.transcripcion { border-top: 1px solid var(--tinta); padding-block: 18px 30px; }
@media (min-width: 960px) {
  .transcripcion {
    position: sticky; top: 0; align-self: start;
    max-height: 100vh; overflow-y: auto;
    border-top: 0; border-left: 1px solid var(--linea);
    padding: clamp(32px, 6vh, 72px) 0 40px 32px;
  }
}
.t-titulo {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--rotulo);
  padding-bottom: 12px; border-bottom: 1px solid var(--linea);
}
.t-titulo b { font-weight: 500; color: var(--tinta); }
.t-vacio { font-size: 14px; line-height: 1.6; color: var(--gris); margin: 16px 0 0; max-width: 34ch; }
.t-cap { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--firma); margin-top: 22px; }
.t-par { display: block; padding: 10px 0; border-bottom: 1px solid var(--linea-fina); }
.t-p { display: block; font-size: 13px; line-height: 1.5; color: var(--gris); }
.t-p i, .t-r i { font-family: var(--display); font-style: italic; color: var(--firma); font-size: 15px; margin-right: 4px; }
.t-r { display: block; font-family: var(--display); font-size: 19px; line-height: 1.3; margin-top: 2px; }
.t-r--alarma { color: var(--alarma); }
.t-par--nuevo { animation: nuevo 900ms var(--ease) both; }
@keyframes nuevo { from { background: var(--tenue); } to { background: transparent; } }

.barra-movil {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--papel); border-top: 1px solid var(--tinta);
  padding: 12px max(22px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.barra-movil button { font-size: 14px; font-weight: 500; color: var(--accion); min-height: 40px; padding: 0 4px; white-space: nowrap; flex: none; }
.barra-ultima {
  display: block; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: var(--display); font-size: 18px; color: var(--tinta);
}
.barra-ultima i { font-style: italic; color: var(--firma); margin-right: 5px; }
.barra-ultima--vacia { font-family: var(--sans); font-size: 13px; color: var(--gris); }
.barra-movil.llega .barra-ultima { animation: llega 700ms var(--ease) both; }
@keyframes llega { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (min-width: 960px) { .barra-movil { display: none; } }

@media (max-width: 959px) {
  .transcripcion { display: none; }
  .transcripcion.abierta {
    display: block; position: fixed; inset: 0; z-index: 30;
    background: var(--papel); overflow-y: auto; border-top: 0;
    padding: calc(22px + env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) 40px max(22px, env(safe-area-inset-left, 0px));
  }
}
.cerrar { font-size: 14px; font-weight: 500; color: var(--accion); }
@media (min-width: 960px) { .cerrar { display: none; } }

.vuela {
  position: fixed; z-index: 40; pointer-events: none;
  font-family: var(--display); font-weight: 300; line-height: 1.2; color: var(--tinta);
  transform-origin: left top;
  transition: transform 440ms var(--ease), opacity 440ms var(--ease);
}

@media (prefers-reduced-motion: reduce) {
  .entra, .t-par--nuevo, .barra-movil.llega .barra-ultima { animation: none !important; }
  *, *::before, *::after { transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div class="banda"><div class="marco">
  <strong>Demostración.</strong> Las preguntas las ajusta la Dra. El mensaje llega a un número de prueba.
</div></div>

<div class="marco">
  <header class="cabecera">
    <a href="index.html">Dra. Daphne Amaral Alemán</a>
    <span>Tu primera valoración</span>
    <span class="folio" id="folio">DA-0000</span>
  </header>

  <div class="escena">
    <main class="escenario" id="escenario"></main>
    <aside class="transcripcion" id="transcripcion" aria-label="Tus respuestas"></aside>
  </div>
</div>

<div class="barra-movil" id="barra"></div>

<script>
// ---------------------------------------------------------------
// LOS SERVICIOS, tal como los presenta la Dra., agrupados.
// Cada uno trae una o dos preguntas cortas.
//   et     = cómo se etiqueta la respuesta en el mensaje
//   varias = se pueden marcar varias opciones
//   alarma = conviene verlo pronto
//   si     = solo aparece si otra respuesta lo pide
//   id compartido = si dos servicios hacen la misma pregunta, se hace una vez
// ---------------------------------------------------------------
var GRUPOS = [
  { nombre: 'Ortodoncia', servicios: ['invisalign', 'brackets'] },
  { nombre: 'Salud funcional', servicios: ['sueno', 'atm'] },
  { nombre: 'Odontología general', servicios: ['limpieza', 'resinas'] },
  { nombre: 'Estética', servicios: ['blanqueamiento'] },
  { nombre: 'Para niños', servicios: ['infantil'] },
  { nombre: 'Si no sabes por dónde empezar', servicios: ['integral'] }
];

var PREVIA = {
  id: 'previa', p: '¿Has usado ortodoncia antes?', et: 'Ortodoncia previa',
  ops: [
    { t: 'Nunca' },
    { t: 'Sí, brackets' },
    { t: 'Sí, alineadores' },
    { t: 'Estoy en tratamiento' }
  ]
};

var SERVICIOS = {
  invisalign: {
    nombre: 'Invisalign', desc: 'Alineadores transparentes', tema: 'luz',
    preguntas: [
      { id: 'corregir', p: '¿Qué te gustaría corregir?', et: 'Quiere corregir', varias: true,
        ops: [{ t: 'Dientes chuecos' }, { t: 'Espacios entre dientes' }, { t: 'Mi mordida' }, { t: 'No sé, quiero que me revisen' }] },
      PREVIA
    ]
  },
  brackets: {
    nombre: 'Brackets', desc: 'Ortodoncia convencional',
    preguntas: [
      { id: 'corregir', p: '¿Qué te gustaría corregir?', et: 'Quiere corregir', varias: true,
        ops: [{ t: 'Dientes chuecos' }, { t: 'Espacios entre dientes' }, { t: 'Mi mordida' }, { t: 'No sé, quiero que me revisen' }] },
      PREVIA
    ]
  },
  sueno: {
    nombre: 'Respiración y sueño', desc: 'Ronquidos, boca abierta al dormir', tema: 'noche',
    preguntas: [
      { id: 'sueno', p: '¿Qué has notado?', et: 'Ha notado', varias: true,
        ops: [{ t: 'Respiro por la boca' }, { t: 'Ronco' }, { t: 'Nariz tapada seguido' }, { t: 'Despierto cansado' }] },
      { id: 'pausas', p: '¿Te han dicho que dejas de respirar al dormir?', et: 'Pausas al dormir',
        si: { id: 'sueno', incluye: 1 },
        ops: [{ t: 'Sí', alarma: true }, { t: 'No' }, { t: 'No sé' }] }
    ]
  },
  atm: {
    nombre: 'Mandíbula (ATM)', desc: 'Dolor, ruidos o bloqueos',
    preguntas: [
      { id: 'atm', p: '¿Qué molestia tienes?', et: 'Molestia', varias: true,
        ops: [{ t: 'Me duele' }, { t: 'Me truena al abrir' }, { t: 'Me cuesta abrir la boca' }, { t: 'Se me traba', alarma: true }] },
      { id: 'desde', p: '¿Desde cuándo?', et: 'Desde',
        ops: [{ t: 'Unos días' }, { t: 'Unas semanas' }, { t: 'Meses o más' }] }
    ]
  },
  limpieza: {
    nombre: 'Limpieza', desc: 'Revisión y prevención',
    preguntas: [
      { id: 'ultima', p: '¿Cuándo fue tu última limpieza?', et: 'Última limpieza',
        ops: [{ t: 'Hace menos de 6 meses' }, { t: 'Hace 6 meses a un año' }, { t: 'Hace más de un año' }, { t: 'No me acuerdo' }] },
      { id: 'sangrado', p: '¿Te sangran las encías al cepillarte?', et: 'Sangrado de encías',
        ops: [{ t: 'Sí' }, { t: 'A veces' }, { t: 'No' }] }
    ]
  },
  resinas: {
    nombre: 'Resinas', desc: 'Caries o dientes rotos',
    preguntas: [
      { id: 'resinas', p: '¿Qué te gustaría revisar?', et: 'Revisar', varias: true,
        ops: [{ t: 'Una posible caries' }, { t: 'Un diente roto' }, { t: 'Una resina vieja' }, { t: 'Sensibilidad' }, { t: 'Dolor fuerte o inflamación', alarma: true }] }
    ]
  },
  blanqueamiento: {
    nombre: 'Blanqueamiento', desc: 'Dientes más blancos', tema: 'luz',
    preguntas: [
      { id: 'blanco', p: '¿Qué te gustaría lograr?', et: 'Busca',
        ops: [{ t: 'Dientes más blancos' }, { t: 'Quitar manchas' }, { t: 'Verme bien para un evento' }, { t: 'Conocer opciones' }] }
    ]
  },
  infantil: {
    nombre: 'Odontología infantil', desc: 'Desarrollo y mordida',
    preguntas: [
      { id: 'edad', p: '¿Qué edad tiene?', et: 'Edad',

// ---------------------------------------------------------------
// Estado
// ---------------------------------------------------------------
function estadoInicial() {
  return {
    fase: 'quien',     // quien · servicios · pregunta · prioridad · datos · final
    elegidos: [],      // servicios marcados, en orden del catálogo
    qi: 0,             // índice dentro de la lista plana de preguntas
    resp: {},          // id → número (una) o arreglo (varias)
    prio: null,
    paciente: '', tutor: '', comentario: '',
    ultima: null
  };
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function guardar() { hist.push(JSON.stringify(est)); }
function esNino() { return est.resp.quien === 1; }

// La lista plana de pantallas de preguntas: servicio por servicio,
// sin repetir preguntas compartidas, respetando las condicionales.
function recorrido() {
  var vistos = {}, lista = [];
  est.elegidos.forEach(function (sid) {
    SERVICIOS[sid].preguntas.forEach(function (q) {
      if (vistos[q.id]) return;
      if (q.si) {
        var r = est.resp[q.si.id];
        if (!r || r.indexOf(q.si.incluye) === -1) return;
      }
      vistos[q.id] = true;
      lista.push({ sid: sid, q: q });
    });
  });
  return lista;
}
function elegidas(q) {
  var r = est.resp[q.id];
  if (r === undefined) return [];
  return (Array.isArray(r) ? r : [r]).map(function (i) { return q.ops[i]; });
}
function alarmas() {
  var a = [];
  recorrido().forEach(function (x) {
    elegidas(x.q).forEach(function (o) {
      if (o.alarma) a.push(x.q.et + ': ' + o.t.toLowerCase());
    });
  });
  return a;
}

// ---------------------------------------------------------------
// El mensaje
// ---------------------------------------------------------------
function recado() {
  var lista = recorrido();
  var orden = est.elegidos.slice();
  if (est.prio) orden = [est.prio].concat(orden.filter(function (s) { return s !== est.prio; }));

  var quien = esNino()
    ? 'Soy ' + (est.tutor || 'madre/padre de familia') + '. La cita es para ' + (est.paciente || 'mi hijo o hija') + '.'
    : (est.paciente ? 'Soy ' + est.paciente + '.' : '');
  var l = ['Hola, doctora. ' + quien, 'Ficha ' + folio, '',
    'SERVICIOS: ' + est.elegidos.map(function (s) { return SERVICIOS[s].nombre; }).join(', ')];
  if (orden.length > 1 && est.prio) l.push('EMPEZAR POR: ' + SERVICIOS[est.prio].nombre);

  orden.forEach(function (sid) {
    var mias = lista.filter(function (x) { return x.sid === sid; });
    if (!mias.length) return;
    l.push('', SERVICIOS[sid].nombre.toUpperCase());
    mias.forEach(function (x) {
      var ops = elegidas(x.q);
      if (ops.length) l.push('· ' + x.q.et + ': ' + ops.map(function (o) { return o.t.toLowerCase(); }).join(', '));
    });
  });

  var al = alarmas();
  if (al.length) l.push('', 'ATENCIÓN PRONTA: ' + al.join('; '));
  if (est.comentario) l.push('', 'COMENTARIO: ' + est.comentario);
  l.push('', 'Me gustaría agendar una valoración.');
  return l.join('\n');
}

// ---------------------------------------------------------------
// Transcripción
// ---------------------------------------------------------------
function par(q, rotulo) {
  var ops = elegidas(q);
  if (!ops.length) return '';
  var alarma = ops.some(function (o) { return o.alarma; });
  return (rotulo ? '<span class="t-cap">' + esc(rotulo) + '</span>' : '') +
    '<span class="t-par' + (q.id === ultimoId ? ' t-par--nuevo' : '') + '">' +
    '<span class="t-p"><i>P.</i>' + esc(q.p) + '</span>' +
    '<span class="t-r' + (alarma ? ' t-r--alarma' : '') + '"><i>R.</i>' +
    esc(ops.map(function (o) { return o.t; }).join(', ')) + '</span></span>';
}
function totalRespuestas() {
  var n = est.resp.quien !== undefined ? 1 : 0;
  if (est.elegidos.length) n++;
  recorrido().forEach(function (x) { if (elegidas(x.q).length) n++; });
  return n;
}
function vistaTranscripcion() {
  var out = '<div class="t-titulo"><span>Tus respuestas · <b>' + folio + '</b></span>' +
    '<button type="button" class="cerrar" data-accion="cerrar-panel">Cerrar</button></div>';
  if (est.resp.quien === undefined) {
    return out + '<p class="t-vacio">Aquí se van escribiendo tus respuestas. Es lo que lee la doctora.</p>';
  }
  out += par(QUIEN, 'Para empezar');
  if (est.elegidos.length) {
    out += '<span class="t-par"><span class="t-p"><i>P.</i>¿Qué te gustaría revisar?</span>' +
      '<span class="t-r"><i>R.</i>' + esc(est.elegidos.map(function (s) { return SERVICIOS[s].nombre; }).join(', ')) + '</span></span>';
  }
  var ultimoSid = null;
  recorrido().forEach(function (x) {
    var h = par(x.q, x.sid !== ultimoSid ? SERVICIOS[x.sid].nombre : '');
    if (h) { out += h; ultimoSid = x.sid; }
  });
  return out;
}

// ---------------------------------------------------------------
// Render
// ---------------------------------------------------------------
function render() {
  var v = { quien: vistaQuien, servicios: vistaServicios, pregunta: vistaPregunta,
    prioridad: vistaPrioridad, datos: vistaDatos, final: vistaFinal }[est.fase];

  var tema = '';
  if (est.fase === 'pregunta') {
    var x = recorrido()[est.qi];
    tema = SERVICIOS[x.sid].tema || '';
  }
  if (tema) document.documentElement.setAttribute('data-tema', tema);
  else document.documentElement.removeAttribute('data-tema');

  document.getElementById('escenario').innerHTML = v();
  document.getElementById('transcripcion').innerHTML = vistaTranscripcion();

  var n = totalRespuestas();
  var u = est.ultima;
  var barra = document.getElementById('barra');
  barra.innerHTML = (u
      ? '<span class="barra-ultima"><i>R.</i>' + esc(u) + '</span>'
      : '<span class="barra-ultima barra-ultima--vacia">Aquí se van escribiendo tus respuestas</span>') +
    (n ? '<button type="button" data-accion="abrir-panel">' + (n === 1 ? 'Ver' : 'Ver las ' + n) + '</button>' : '');
  barra.classList.toggle('llega', !!ultimoId);

  document.getElementById('folio').textContent = folio;
  window.scrollTo({ top: 0, behavior: 'instant' });
  ultimoId = null;
}

// Refresco ligero al marcar casillas: no redibuja la pantalla.
function refrescarMarcas(selector, marcadas) {
  document.querySelectorAll(selector).forEach(function (b) {
    b.setAttribute('aria-pressed', marcadas.indexOf(b.dataset.valor) !== -1);
  });
}

function avanzar() {
  var lista = recorrido();
  if (est.qi + 1 < lista.length) { est.qi++; return; }
  est.fase = est.elegidos.length > 1 ? 'prioridad' : 'datos';
}

function leerDatos() {
  var p = document.getElementById('paciente'), t = document.getElementById('tutor'), c = document.getElementById('comentario');
  if (p) est.paciente = p.value.trim().slice(0, 60);
  if (t) est.tutor = t.value.trim().slice(0, 60);
  if (c) est.comentario = c.value.trim().slice(0, 300);
}

function accion(a, v) {
  if (a === 'quien') {
    guardar();
    est.resp.quien = Number(v); ultimoId = 'quien'; est.ultima = QUIEN.ops[Number(v)].t;
    // Si la cita es para un niño, se sugiere el servicio infantil.
    if (esNino() && est.elegidos.indexOf('infantil') === -1) est.elegidos.push('infantil');
    est.fase = 'servicios';
  } else if (a === 'servicio') {
    var i = est.elegidos.indexOf(v);
    if (i === -1) est.elegidos.push(v); else est.elegidos.splice(i, 1);
    est.elegidos.sort(function (x, y) { return ORDEN.indexOf(x) - ORDEN.indexOf(y); });
    refrescarMarcas('.servicio', est.elegidos);
    var n = est.elegidos.length, btn = document.querySelector('[data-accion="a-preguntas"]');
    if (btn) btn.disabled = !n;
    var c = document.getElementById('contador');
    if (c) c.textContent = n ? n + (n === 1 ? ' elegido' : ' elegidos') : 'Elige al menos uno';
    return;
  } else if (a === 'a-preguntas') {
    if (!est.elegidos.length) return;
    guardar();
    est.ultima = est.elegidos.map(function (s) { return SERVICIOS[s].nombre; }).join(', ');
    est.qi = 0; est.prio = null; est.fase = 'pregunta';
    if (!recorrido().length) est.fase = 'datos';
  } else if (a === 'responder') {
    var q = recorrido()[est.qi].q, k = Number(v);
    if (q.varias) {
      var arr = (est.resp[q.id] || []).slice(), j = arr.indexOf(k);
      if (j === -1) arr.push(k); else arr.splice(j, 1);
      arr.sort();
      if (arr.length) est.resp[q.id] = arr; else delete est.resp[q.id];
      return render();                       // muestra la marca y el aviso, sin avanzar
    }
    guardar();
    est.resp[q.id] = k; ultimoId = q.id; est.ultima = q.et + ': ' + q.ops[k].t.toLowerCase();
    avanzar();
  } else if (a === 'siguiente') {
    var q2 = recorrido()[est.qi].q;
    if (!elegidas(q2).length) return;
    guardar();
    ultimoId = q2.id;
    est.ultima = q2.et + ': ' + elegidas(q2).map(function (o) { return o.t.toLowerCase(); }).join(', ');
    avanzar();
  } else if (a === 'prioridad') {
    guardar();
    est.prio = est.elegidos[Number(v)]; est.fase = 'datos';
  } else if (a === 'datos') {
    leerDatos(); guardar(); est.fase = 'final';
  } else if (a === 'atras') {
    if (!hist.length) return;
    if (est.fase === 'datos') leerDatos();
    var datos = { paciente: est.paciente, tutor: est.tutor, comentario: est.comentario };
    est = JSON.parse(hist.pop());
    est.paciente = datos.paciente; est.tutor = datos.tutor; est.comentario = datos.comentario;
  } else if (a === 'reiniciar') {
    hist = []; est = estadoInicial();
  } else if (a === 'abrir-panel') {
    document.getElementById('transcripcion').classList.add('abierta'); return;
  } else if (a === 'cerrar-panel') {
    document.getElementById('transcripcion').classList.remove('abierta'); return;
  } else if (a === 'enviar') {
    if (APPS_SCRIPT_URL) {
      fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ folio: folio, paciente: est.paciente, tutor: est.tutor,
          servicios: est.elegidos, resp: est.resp, prio: est.prio, mensaje: recado() })
      }).catch(function () {});
    }
    return;
  } else return;
  render();
}

// La respuesta viaja a la transcripción (escritorio) o a la barra (teléfono).
function volar(boton, despues) {
  var texto = boton.querySelector('.r-texto');
  var ancho = window.innerWidth >= 960;
  var destino = ancho ? document.getElementById('transcripcion') : document.getElementById('barra');
  var quieto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (quieto || !texto || !destino) return despues();

  boton.setAttribute('aria-pressed', 'true');
  var a = texto.getBoundingClientRect(), d = destino.getBoundingClientRect();
  var copia = document.createElement('span');
  copia.className = 'vuela';
  copia.textContent = texto.textContent;
  copia.style.left = a.left + 'px';
  copia.style.top = a.top + 'px';
  copia.style.width = a.width + 'px';
  copia.style.fontSize = getComputedStyle(texto).fontSize;
  document.body.appendChild(copia);

  var x, y;
  if (ancho) {
    var ultimo = destino.lastElementChild;
    var fondo = ultimo ? ultimo.getBoundingClientRect().bottom : d.top + 40;
    x = d.left + 32 - a.left;
    y = Math.min(fondo + 12, window.innerHeight - 60) - a.top;
  } else {
    x = 22 - a.left;
    y = d.top + 12 - a.top;
  }
  ocupado = true;
  requestAnimationFrame(function () {
    copia.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(.66)';
    copia.style.opacity = '0.25';
  });
  setTimeout(function () { copia.remove(); ocupado = false; despues(); }, 450);
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-accion]');
  if (!b || ocupado || b.disabled) return;
  var a = b.dataset.accion, v = b.dataset.valor;
  // Solo vuelan las respuestas que avanzan de pantalla (una sola opción).
  var avanzaSola = a === 'quien' || a === 'prioridad' ||
    (a === 'responder' && est.fase === 'pregunta' && !recorrido()[est.qi].q.varias);
  if (avanzaSola) return volar(b, function () { accion(a, v); });
  accion(a, v);
});

document.addEventListener('keydown', function (e) {
  var tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  var n = parseInt(e.key, 10);
  if (!n) return;
  var ops = document.querySelectorAll('#escenario .r');
  if (ops[n - 1]) ops[n - 1].click();
});

render();
</script>
